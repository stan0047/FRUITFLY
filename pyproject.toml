[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain"
version = "0.1.0"
description = "Bio-inspired vision and navigation research scaffold inspired by the fruit-fly connectome"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "connectome",
    "fruit-fly",
    "drosophila",
    "navigation",
    "spiking-neural-network",
    "reinforcement-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Kept deliberately small. Optional heavy dependencies (connectome tooling,
# live dashboard stack) will be added as extra groups once actually needed.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "gymnasium>=0.29",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Parquet input support. Kept optional: pyarrow is a large wheel and CSV needs
# nothing extra. FlyBrain reads no Parquet file unless asked to.
parquet = ["pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flybrain = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m \"not expensive\""
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "expensive: tests that execute a substantial MCNS benchmark (Phase 4B/4C end-to-end runs); excluded from the default fast suite and run with -m expensive",
]
