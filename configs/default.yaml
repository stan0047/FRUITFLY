project:
  name: flybrain
  description: Bio-inspired vision and navigation scaffold
  seed: 0

# All paths are relative to the repository root (the directory containing
# pyproject.toml). Absolute paths are never hardcoded in the source.
paths:
  data_raw: data/raw
  data_processed: data/processed
  outputs: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures

connectome:
  # "synthetic" = randomly generated graph used for development and tests.
  # "flywire"   = a real, user-downloaded export; no URL is ever fetched for you.
  source: synthetic
  path: null
  # Columns expected in a processed connectome CSV (one row per synapse).
  required_columns: [pre, post, weight]
  optional_columns: [synapse_type, neurotransmitter, neuropil]

  # Import policy for a user-provided file. See data/README.md.
  import:
    # 0 = unlimited. Set a budget when experimenting so a huge export can be
    # loaded and inspected on a laptop or the Colab free tier.
    max_nodes: 0
    max_edges: 0
    # "error" refuses to exceed the budget; "subsample" takes a reproducible subset
    # and labels every statistic as describing a subset.
    on_limit: error
    keep_self_loops: false
    aggregate_duplicates: true
    min_synapse_count: null
    require_known_nodes: true
    drop_null_rows: false
    # Rows per pandas chunk when reading. Bounds parse memory and lets the edge
    # budget stop the read early.
    chunksize: null
    # False drops unmapped source columns, reducing peak memory on large files.
    keep_extra_columns: true
    # Set false when the weight column is a proxy rather than a measured quantity.
    weight_is_biological: true
    seed: 0
    # Optional neuron metadata table, relative to the project root.
    node_table: null

vision:
  grayscale: true
  width: 32
  height: 32
  crop: null
  normalize: true
  frame_stack: 1
  use_motion_channel: false

brain:
  graph:
    num_neurons: 64
    connectivity: 0.15
    seed: 0
    # Arbitrary labels for the synthetic graph only. NOT neuropil names.
    regions: [visual_system, central_brain, descending_pathway]
  neuron:
    tau_membrane: 0.02
    v_threshold: 1.0
    v_reset: 0.0
    v_rest: 0.0
    tau_synapse: 0.005
    refractory_periods: 2
  simulation:
    dt: 0.001
    seed: 0
    weight_scale: 0.35
    external_input_scale: 1.2
    # The simulation holds dense per-step activity arrays, so it refuses graphs
    # larger than this. Extract a subgraph first.
    max_nodes: 2000

navigation:
  width: 7
  height: 7
  num_obstacles: 4
  max_steps: 100
  randomize_layout: true
  initial_heading: north
  actions: [LEFT, FORWARD, RIGHT]
  reward:
    goal: 1.0
    step: -0.01
    collision: -0.1

model:
  baseline:
    hidden_sizes: [64, 64]
    activation: relu
    device: cpu

training:
  # TODO: only REINFORCE-with-baseline exists; PPO is a roadmap item.
  algorithm: reinforce
  episodes: 20
  total_timesteps: 2000
  learning_rate: 0.001
  gamma: 0.99
  grad_clip: 1.0
  log_interval: 1
  device: cpu
  seed: 0
  checkpoint_dir: outputs/checkpoints

visualization:
  max_history: 500
  timeline_window: 200
  dpi: 120
  figure_size: [10, 6]
